<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fibonex360">
  <!-- Site ikonu: yükselen (yeşil) ve düşen (kırmızı) mum, çevresinde "360"
       halkası. Halka yeşilden kırmızıya döner ve sol altta açık kalır.
       Çizim components/Logo.tsx ile aynıdır. -->
  <defs>
    <linearGradient id="logo360" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74C98A"/>
      <stop offset="1" stop-color="#C62742"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0A0F18"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#logo360)" stroke-width="3" stroke-linecap="round" stroke-dasharray="140 24" transform="rotate(115 32 32)"/>
  <g transform="translate(32 32) scale(0.72) translate(-32 -32)">
    <g fill="#74C98A">
      <rect x="22.5" y="16" width="2.4" height="40" rx="0.6"/>
      <rect x="17.4" y="22" width="12.6" height="28" rx="0.8"/>
    </g>
    <g fill="#C62742">
      <rect x="39.1" y="9" width="2.4" height="40" rx="0.6"/>
      <rect x="34" y="15" width="12.6" height="28" rx="0.8"/>
    </g>
  </g>
</svg>
