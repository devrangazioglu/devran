<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Fibonex360 — Bağlantı yok</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070c; color: #e9edf5;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); text-align: center; box-sizing: border-box; }
  img { width: 84px; height: 84px; border-radius: 20px; }
  h1 { font-size: 22px; margin: 6px 0 0; }
  p { color: #8b95a9; max-width: 340px; line-height: 1.6; margin: 0; }
  button { margin-top: 10px; background: #8ff0a4; color: #05070c; border: 0; border-radius: 12px;
    padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .en { font-size: 13px; color: #5f6a7d; }
</style>
</head>
<body>
<main>
  <img src="ikon.png" alt="Fibonex360">
  <h1>İnternet bağlantısı yok</h1>
  <p>Fiyatlar ve sinyaller canlı veriyle hesaplandığı için bağlantı gerekiyor. Bağlantınız gelince tekrar deneyin.</p>
  <p class="en">You are offline. Live prices need a connection.</p>
  <button type="button" id="tekrar">Tekrar dene</button>
</main>
<script>
  // Uygulamanın açtığı adres. Alan adı değişince capacitor.config.ts ile
  // birlikte burayı da güncelleyin.
  var ADRES = "https://analiz-brown.vercel.app/panel";
  function dene() { location.replace(ADRES); }
  document.getElementById("tekrar").addEventListener("click", dene);
  // Bağlantı geri gelince kendiliğinden dene.
  addEventListener("online", dene);
</script>
</body>
</html>
