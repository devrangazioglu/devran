# Günlük piyasa verisi beslemesi.
#
# Neden burada çalışıyor: uygulamanın çalıştığı bulut sağlayıcısının IP aralığı
# anahtarsız veri kaynakları tarafından engelleniyor (ölçüldü: 429). GitHub'ın
# çalıştırıcıları bu aralıkta değil, dolayısıyla veri buradan alınıp doğrudan
# veritabanına yazılıyor. Site zaten önce veritabanına baktığı için hiçbir
# sağlayıcıya gitmiyor ve kota kavramı ortadan kalkıyor.
#
# Kurulum: depo ayarlarında `DATABASE_URL` adında bir secret tanımlayın
# (Vercel'deki Postgres bağlantı dizesinin aynısı).

name: Piyasa verisi

on:
  schedule:
    # 22:20 UTC — ABD seansı kapandıktan sonra, BIST çoktan kapalı.
    # Dakika 0 seçilmedi: o dakikada tüm dünyanın işleri aynı anda kuyruğa girer.
    - cron: "20 22 * * 1-6"
  # Elle çalıştırma: ilk kurulumda ve bir şey bozulduğunda.
  workflow_dispatch:

# Aynı anda iki besleme çalışmasın; ikisi de aynı satırlara yazar.
concurrency:
  group: piyasa-verisi
  cancel-in-progress: false

jobs:
  besle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Veriyi çek ve veritabanına yaz
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run besle
