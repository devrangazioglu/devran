# Veri kaynağı ölçümü.
#
# Tek bir soruyu yanıtlar: bu makineden piyasa verisi alınabiliyor mu?
# Veritabanı gerekmez, secret gerekmez, hiçbir yere yazmaz — yalnızca birkaç
# sembol çekip sonucu basar. Beslemenin "veri alma" ve "veritabanına yazma"
# ayaklarını birbirinden ayırmak için var: biri çalışmayınca diğeri hakkında
# hüküm vermek kolay ama yanlış oluyor.
#
# Actions → Veri kaynağı testi → Run workflow ile çalıştırın.

name: Veri kaynağı testi

on:
  workflow_dispatch:

jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Bu adım bir dönem hata veriyordu (kaynak bu makineyi de engelliyordu)
      # ve hatayı yutmak zorundaydık. Artık aktarıcı üzerinden 6/6 geçiyor, bu
      # yüzden hata yutulmuyor: bozulursa görünsün.
      - name: Kaynaktan birkaç sembol çek
        run: npm run besle -- --dene

      # Aday kaynakların tamamını dener: hangisi bu makineden cevap veriyor,
      # gün içi veri var mı, veri kaç dakika gecikmeli.
      - name: Ücretsiz kaynakları tara
        run: npm run kaynak-tara

      # Asıl soru burada yanıtlanıyor: kaynak **Vercel'in** IP aralığından da
      # cevap veriyor mu? Yahoo vermiyordu ve bu, bütün tasarımı belirleyen
      # kısıttı. Bu adım yayındaki sayfayı çekip tabloda gerçek fiyat var mı,
      # yoksa demo/hata notu mu çıkmış diye bakar. Ölçüm yerine varsayım
      # yürütmek, kullanıcıya boş tablo göstermek demek olurdu.
      - name: Yayındaki sayfada canlı veri var mı?
        env:
          ONIZLEME: https://analiz-brown.vercel.app/piyasa/turkiye-borsasi
        run: |
          sayfa="$(curl -sS -m 45 "$ONIZLEME" || true)"
          if [ -z "$sayfa" ]; then
            echo "::warning::Sayfa alınamadı; dağıtım sürüyor olabilir."
            exit 0
          fi
          echo "Sayfa boyutu: $(printf %s "$sayfa" | wc -c) bayt"
          if printf %s "$sayfa" | grep -q "demo veri gösteriliyor"; then
            echo "::error::Yayındaki sayfa DEMO veri gösteriyor — kaynak Vercel'den cevap vermiyor."
            exit 1
          fi
          if printf %s "$sayfa" | grep -q "notice-error"; then
            echo "::error::Yayındaki sayfada hata notu var."
            printf %s "$sayfa" | grep -o 'notice notice-error[^<]*<[^>]*>[^<]*' | head -3
            exit 1
          fi
          # THYAO satırı ve yanında bir fiyat var mı?
          if printf %s "$sayfa" | grep -q "THYAO"; then
            echo "✓ Canlı veri geldi; THYAO tabloda."
          else
            echo "::warning::THYAO tabloda yok; liste beklenenden farklı."
          fi
